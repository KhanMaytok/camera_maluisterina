services:
  backend:
    build: ./backend
    environment:
      PORT: 3000
      DATABASE_PATH: /data/grabadora.db
      MEDIA_DIR: /data/media
      PUBLIC_BASE_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      REFRESH_SECRET: ${REFRESH_SECRET:-dev-refresh-secret-change-me}
      CORS_ORIGINS: "*"
      STORAGE_ENABLED: ${STORAGE_ENABLED:-false}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_CLIPS: ${S3_BUCKET_CLIPS:-grabadora-clips}
      S3_BUCKET_THUMBS: ${S3_BUCKET_THUMBS:-grabadora-thumbs}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
    volumes:
      - backend-data:/data
    ports:
      - "3000:3000"

  viewer:
    build: ./viewer
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  backend-data:

